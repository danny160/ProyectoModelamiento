<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>OptiWatt</title>
  <link rel="shortcut icon" href="Recursos/optiWatt.ico" type="image/x-icon">

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Stilos css -->
  <link rel="stylesheet" href="chabox/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


</head>

<body>
  <div class="sim-container">

    <!-- Titulo -->
    <div class="sim-title-wrapper">
      <div class="sim-title">
        <img src="Recursos/optiWatt.png" alt="Logo" class="sim-logo" />
        <div class="sim-text">
          <span class="logo-gradient">Opti</span><span class="logo-gradient-alt">Wa<span
              class="highlight-t">tt</span></span>
        </div>
      </div>
      <div class="subtitle"><b>Simulador de consumo energetico</b></div>
    </div>

    <!-- Formulario de selecciones -->
    <form>

      <!-- Seleccion de entorno de simulacion, horas y valor -->
      <div class="form-block">
        <div class="form-columns-container">

          <!-- Columna 1: Tipo de escenario -->
          <div class="form-column">
            <label class="label-title">Tipo de escenario:</label>
            <div class="input-row">
              <select class="input-box select-box" id="tipoEscenario">
                <option value="none"></option>
                <option value="salon">Salón de clases</option>
                <option value="lab">Laboratorio de informática</option>
              </select>
            </div>
            <div class="input-desc">Selecciona el entorno que deseas simular.</div>
          </div>

          <!-- Columna 2: Horas totales -->
          <div class="form-column">
            <label class="label-title">Horas totales para simular:</label>
            <div class="input-row">
              <input type="number" class="input-box" id="horasSimulacion" value="2" min="1" max="24" />
            </div>
            <div class="input-desc">Define la duración de la simulación.</div>
          </div>

          <!-- Columna 3: Valor del KWh -->
          <div class="form-column">
            <label class="label-title">Costo por KWh:</label>
            <div class="input-row">
              <input type="number" class="input-box" id="valorKwh" value="600" min="0" />
            </div>
            <div class="input-desc">Ingresa el valor según tu tarifa eléctrica.</div>
          </div>

        </div>
      </div>

      <!-- Contenedor de dispositivos (dinámico) -->
      <div class="form-block" style="padding: 13px 22px;">
        <div id="devicesContainer" class="form-columns-container">
          <!-- Aquí se generarán dinámicamente las columnas de dispositivos -->
        </div>
      </div>

      <button type="button" class="btn-simular" id="startSim">Iniciar Simulación</button>
    </form>

    <!-- mensaje de exito -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <!-- -------------------------------------------------------- -->

  <!-- CHATBOT: Botón para abrir -->
  <button type="button" class="buttonOpenChat">
    <span>¡Hola soy OptiWatt!</span>
    <img src="chabox/img/BOT2.png" width="75px" alt="">
  </button>

  <!-- CHATBOT: Ventana de Chat -->
  <div class="chat">
    <header>
      <div class="name">
        <p>
          <img src="chabox/img/BOT2.png" width="45px" alt="">
          <strong>
            <h1 class="chatbox-title">
              <span class="logo-gradient">Opti</span>
              <span class="logo-gradient-alt">Wa<span class="highlight-t">tt</span></span>
            </h1>

          </strong>
        </p>
      </div>
      <div class="options">
        <button type="button" id="clearDisplay"><i class="bi bi-arrow-clockwise"></i></button>
        <button type="button" class="closed-chat" title="Cerrar"><i class="bi bi-x"></i></button>
      </div>
    </header>

    <div class="display">
      <div class="message">
        <img src="chabox/img/BOT2.png" width="55px" alt="">
        <div class="result">
          <p>¡Hola! Soy OptiWatt, tu asistente en eficiencia energética.
            <br><br>¿En qué te puedo ayudar el día de hoy?
          </p>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <div class="typing" id="typing">
        <span></span><span></span><span></span>
      </div>
      <textarea placeholder="¡¡Haz tu pregunta aquí!!" id="inputChatUser"></textarea>
      <button type="button" id="chatButtonSend">
        <i class="bi bi-send"></i>
      </button>
    </div>
  </div>


  <script src="script.js"></script>
  <script src="chabox/api_key.js"></script>
  <script src="chabox/chatBot.js"></script>


</body>

</html>
